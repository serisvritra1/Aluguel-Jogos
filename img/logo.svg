<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cloud -->
  <g filter="url(#glow)">
    <path d="M220 220
             C170 220, 150 180, 170 145
             C180 110, 220 90, 260 100
             C280 70, 330 65, 365 95
             C420 90, 450 130, 445 175
             C475 185, 485 230, 450 250
             L220 250
             C190 250, 170 240, 160 225
             Z"
          fill="url(#cloudGrad)"/>

    <!-- Orbit -->
    <ellipse cx="305" cy="180" rx="150" ry="48"
             fill="none"
             stroke="white"
             stroke-width="14"/>

    <!-- Controller -->
    <g transform="translate(240,145)">
      <rect x="0" y="0" rx="28" ry="28" width="120" height="70"
            fill="#2b0000"/>

      <rect x="22" y="24" width="24" height="8" rx="2" fill="white"/>
      <rect x="30" y="16" width="8" height="24" rx="2" fill="white"/>

      <circle cx="85" cy="24" r="6" fill="white"/>
      <circle cx="100" cy="36" r="6" fill="white"/>
      <circle cx="84" cy="48" r="6" fill="white"/>
      <circle cx="70" cy="36" r="6" fill="white"/>
    </g>
  </g>

  <!-- Text -->
  <text x="500" y="225"
        font-family="Arial, Helvetica, sans-serif"
        font-size="110"
        font-style="italic"
        font-weight="bold"
        fill="#ff2a2a"
        filter="url(#glow)">
    SeriCloud
  </text>
</svg>
